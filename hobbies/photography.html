      <h1>摄影</h1>
      <p class="subtitle">PHOTOGRAPHY</p>
    </header>

    <div class="hobby-content">
      <p>摄影对我来说不只是记录，而是一种观察世界的方式。我喜欢捕捉生活中被忽略的细节、人与空间之间的情绪关系，以及光线落在风景画面里的微妙层次。</p>
      <p>我喜欢温暖的光线，喜欢带有颗粒感的胶片，每一次摁下的快门的地方，都是我目光所及之处。</p>
    </div>
