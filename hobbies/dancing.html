      <h1>跳舞</h1>
      <p class="subtitle">DANCING</p>
    </header>

    <div class="hobby-content">
      <p>舞蹈是我表达情绪、释放能量和连接团队的重要方式。对我而言，跳舞不仅是动作训练，更是一种关于节奏、协调与舞台感的长期积累。</p>
      <p>从社团日常训练到大型比赛和专场演出，我逐渐建立起对排练组织、舞台呈现和团队合作的理解。它让我习惯在高压环境中保持节奏，也让我更擅长带动团队状态。</p>
    </div>
