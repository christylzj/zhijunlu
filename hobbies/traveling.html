      <h1>旅游</h1>
      <p class="subtitle">TRAVELING</p>
    </header>

    <div class="hobby-content">
      <p>旅行带给我的吸引力，不只是抵达新的地方，而是在移动过程中重新观察环境、节奏和人与城市之间的关系。</p>
      <p>我喜欢通过行走、拍摄和记录，把每一次短暂停留变成更具体的记忆。旅行也让我更容易保持开放视角，在陌生的情境里快速适应与感受。</p>
    </div>
